name: GitHubMirrorPlugin
version: 1.0.0
main: com.githubmirror.GitHubMirrorPlugin
api-version: 1.20
author: YourName
description: 自动测速并选择最快GitHub镜像站，解决国内MC服务器连接GitHub困难的问题
website: https://github.com/yourusername/GitHubMirrorPlugin

commands:
  githubmirror:
    description: GitHub镜像站管理命令
    usage: /githubmirror <test|status|set|reset|list>
    permission: githubmirror.admin
    aliases: [ghm, ghmirror]

permissions:
  githubmirror.admin:
    description: 允许管理GitHub镜像站设置
    default: op
  githubmirror.use:
    description: 允许使用镜像站功能
    default: true