# GitHubMirrorPlugin 配置文件
# 自动测速并选择最快的GitHub镜像站
#
# ============================================================
# 镜像站类型说明 (type 字段):
#   prefix  - 前缀代理模式 (2026年主流):
#             https://gh-proxy.com/https://github.com/user/repo/...
#             只需配置 url 字段，支持 Releases/Raw/Archive/Gist/API/头像
#
#   replace - 域名替换模式:
#             https://github.com/user/repo -> https://bgithub.xyz/user/repo
#             可选配置 apiUrl / rawUrl 对应替换域名(留空=该类资源不加速)
#
# 提示: 若从旧版升级，建议删除本文件让插件重新生成默认配置。
#       FastGit/cnpmjs/旧版ghproxy 等镜像已于 2024-2025 年间陆续失效。
# ============================================================

mirrors:
  - name: "GitHub官方 (直连)"
    type: replace
    url: "https://github.com"
    apiUrl: "https://api.github.com"
    rawUrl: "https://raw.githubusercontent.com"
    priority: 100
    enabled: true

  - name: "gh-proxy.com (Cloudflare全球, 推荐)"
    type: prefix
    url: "https://gh-proxy.com"
    priority: 1
    enabled: true

  - name: "ghproxy.net"
    type: prefix
    url: "https://ghproxy.net"
    priority: 2
    enabled: true

  - name: "ghproxy.homeboyc.cn (大文件稳定)"
    type: prefix
    url: "https://ghproxy.homeboyc.cn"
    priority: 3
    enabled: true

  - name: "github.akams.cn (支持API)"
    type: prefix
    url: "https://github.akams.cn"
    priority: 4
    enabled: true

  - name: "bgithub.xyz (全站浏览镜像)"
    type: replace
    url: "https://bgithub.xyz"
    priority: 5
    enabled: true

  - name: "kkgithub.com (全站浏览镜像)"
    type: replace
    url: "https://kkgithub.com"
    priority: 6
    enabled: true

# 测速配置
speedtest:
  # 测速超时时间(毫秒)
  timeout: 5000
  # 测速重试次数
  retries: 2
  # 并发测速数量
  concurrent: 3
  # 测速间隔(小时) - 0表示不自动测速
  interval: 6
  # 测速用的测试文件 (小文件，快速测速)
  testFile: "https://raw.githubusercontent.com/github/gitignore/main/README.md"
  # 备用测试文件
  fallbackTestFiles:
    - "https://raw.githubusercontent.com/golang/go/master/README.md"
    - "https://raw.githubusercontent.com/python/cpython/main/README.rst"

# 当前选中的镜像站 (自动更新，手动修改后重载生效)
currentMirror: ""

# 是否启用自动切换到最快镜像
autoSwitch: true

# 是否在控制台输出测速详情与重定向日志
verbose: true

# 代理设置 (如果服务器需要代理才能访问国外网站)
proxy:
  enabled: false
  host: ""
  port: 0
  username: ""
  password: ""

# 事件监听配置
events:
  # 插件加载时自动测速
  onEnable: true
  # 定时任务触发测速
  scheduled: true
  # 测速完成后广播给OP
  broadcastToOps: true